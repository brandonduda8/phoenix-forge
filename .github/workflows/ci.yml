name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # stdlib-only: nothing to pip install
      - name: Unit tests (gates, file jail, shell blocklist, loop)
        run: python -m unittest discover -s tests -t . -v
      - name: Self-test from a plain clone
        run: python phoenix.py --self-test
